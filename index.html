<!doctype html>
<html lang="en" data-shop="day">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Thuvarakan • Day Shop / Night Shop</title>
    <script>
      (() => {
        let theme = 'day';
        try {
          const saved = localStorage.getItem('thuvarakan-shop');
          if (saved === 'day' || saved === 'night') theme = saved;
        } catch {}
        document.documentElement.dataset.shop = theme;
        document.documentElement.classList.add('js');
      })();
    </script>
    <meta name="description" content="Thuvarakan’s portfolio: from graphic design through UI, development and consulting to QA engineering, with an ambition to build a business of his own." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='8' fill='%23f45b35'/%3E%3Ctext x='7' y='29' font-size='27' font-family='Arial' font-weight='bold' fill='%23171916'%3Ea.%3C/text%3E%3C/svg%3E" />
  </head>
  <body class="immersive-store">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
